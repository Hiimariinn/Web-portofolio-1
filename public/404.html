<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 Not Found</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Just+Another+Hand&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: white;
        color: black;
        text-align: center;
      }
      body nav {
        font-family: "Just Another Hand", cursive;
        font-size: 2rem;
        display: flex;
        position: fixed;
        width: 100%;
        height: 7rem;
        background: white;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        z-index: 10;
        border-bottom: 2px solid black;
      }
      body nav .left-side-nav {
        margin-left: 2rem;
        font-size: 3rem;
      }
      body nav .right-side-nav {
        margin-right: 2rem;
        display: flex;
        align-items: center;
        gap: 20px;
      }
      body nav .right-side-nav ul {
        display: flex;
        flex-direction: row;
        list-style: none;
        padding: 0;
        margin: 0;
        gap: 2rem;
      }
      body nav .right-side-nav ul li a {
        text-decoration: none;
        color: black;
        transition: color 0.3s ease-in-out;
        cursor: url("/cursor/pixil-frame-2.png") 16 16, pointer;
      }
      body nav .right-side-nav ul li a:hover {
        color: gray;
      }
      body nav .right-side-nav button {
        background: none;
        border: 1px solid black;
        padding: 5px 10px;
        cursor: url("/cursor/pixil-frame-2.png") 16 16, pointer;
        transition: background 0.3s ease-in-out;
      }
      body nav .right-side-nav button:hover {
        border: 1px solid rgb(255, 255, 255);
        background: #7d0a0a;
        color: white;
      }
      .error-container {
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
      .error-code {
        font-size: 10rem;
        font-weight: bold;
        color: red;
      }
      .error-message {
        font-size: 1.5rem;
        margin-bottom: 20px;
      }
      .btn-custom {
        background-color: black;
        color: white;
        border: 2px solid red;
        padding: 10px 20px;
        font-size: 1.2rem;
        text-decoration: none;
        transition: 0.3s;
      }
      .btn-custom:hover {
        background-color: red;
        color: white;
        border: 2px solid black;
      }
      body footer {
        background-color: #7d0a0a;
        color: white;
        padding: 3rem;
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        height: 50vh;
        overflow: hidden;
        text-align: center;
      }
      body footer h1 {
        margin-bottom: 0;
      }
      body footer img {
        position: absolute;
        width: 140%;
        top: 39%;
      }
    </style>
  </head>
  <body>
    <nav>
      <div class="left-side-nav">
        <p class="nama">Muhammad Reval</p>
      </div>
      <div class="right-side-nav">
        <ul>
          <li>
            <a href="https://muhammadreii.web.app/" data-i18n="project"
              >Project</a
            >
          </li>
          <li>
            <a href="https://muhammadreii.web.app/" data-i18n="article"
              >Article</a
            >
          </li>
          <li>
            <a href="https://muhammadreii.web.app/" data-i18n="about">About</a>
          </li>
          <!-- <button id="toggle-lang" data-i18n="button">ID</button> -->
        </ul>
      </div>
    </nav>
    <div class="error-container">
      <div class="error-code">404</div>
      <div class="error-message">
        Oops! The page you are looking for does not exist.
      </div>
      <a href="https://muhammadreii.web.app/" class="btn btn-custom"
        >Go Back Home</a
      >
    </div>
    <footer>
      <h1 data-i18n="thanks" data-aos="fade-up">
        i think you go to wrong site
      </h1>
      <p data-i18n="credit" data-aos="fade-up">
        Made by myself with advice from a friend :D <br />
        Credit for all elemen design i get from freepik
      </p>
      <img src="/src/crown-red.png" alt="" data-aos="fade-up" />
    </footer>
  </body>
</html>
